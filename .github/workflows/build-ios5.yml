name: Build and Release iGPT iOS 5 DEB
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/build-ios5.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential git curl xz-utils dpkg-dev fakeroot rsync perl libtinfo6 libxml2
      - name: Install Theos, iOS toolchain, iOS 10.3 SDK
        shell: bash
        run: |
          set -euxo pipefail
          export THEOS="$RUNNER_TEMP/theos"
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain" "$THEOS/sdks"
          curl --fail --location --retry 3 --silent --show-error https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          git clone --depth=1 https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          cp -a "$RUNNER_TEMP/sdks/iPhoneOS10.3.sdk" "$THEOS/sdks/"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
      - name: Build armv7 rootful .deb
        run: |
          set -euxo pipefail
          # Default Theos scheme is rootful and is required by iOS 5/Cydia.
          make -C client clean package FINALPACKAGE=1
          ls -lah client/packages/
          test "$(find client/packages -name '*.deb' | wc -l)" -gt 0
      - name: Verify package and ARMv7 Mach-O
        shell: bash
        run: |
          set -euxo pipefail
          deb="$(find client/packages -name '*.deb' -print -quit)"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          dpkg-deb --contents "$deb" | grep -F 'Applications/Igpt.app/Igpt'
          work="$RUNNER_TEMP/igpt-deb"
          dpkg-deb -x "$deb" "$work"
          file "$work/Applications/Igpt.app/Igpt" | tee /tmp/igpt-file.txt
          grep -Eqi 'armv7|arm' /tmp/igpt-file.txt
          "$THEOS/toolchain/linux/iphone/bin/llvm-objdump" --macho --private-headers "$work/Applications/Igpt.app/Igpt" | grep -A3 LC_VERSION_MIN_IPHONEOS | grep -F 'version 5.0'
      - name: Upload downloadable DEB
        uses: actions/upload-artifact@v4
        with:
          name: iGPT-iPad1-iOS5.1.1
          path: client/packages/*.deb
          if-no-files-found: error
      - name: Publish prerelease only after successful build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-ios5-preview
          name: iGPT iPad 1 iOS 5.1.1 preview
          prerelease: true
          make_latest: false
          body: |
            PREVIEW ONLY. Compiled package is intended for jailbroken iPad 1 on iOS 5.1.1.
            The VPS bridge must be deployed separately. ChatGPT account login and video playback have not been validated on a physical device.
            Never enter your SSH/root password into iGPT. Use a separately generated bridge token.
          files: client/packages/*.deb
