name: Build iOS 5 armv7 Cydia package
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Prerequisites
        run: sudo apt-get update && sudo apt-get install -y make git curl xz-utils dpkg-dev fakeroot
      - name: Install Theos and Linux cross compiler
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          mkdir -p "$RUNNER_TEMP/theos/toolchain"
          curl -fLsS https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$RUNNER_TEMP/theos/toolchain"
          git clone --depth=1 https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          cp -a "$RUNNER_TEMP/sdks/iPhoneOS9.3.sdk" "$RUNNER_TEMP/theos/sdks/"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
      - name: Build .deb
        run: make -C client clean package FINALPACKAGE=1
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: iGPT-iOS5-armv7
          path: client/packages/*.deb
          if-no-files-found: error
